<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="16" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff06" stroke-width="1">
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="140" x2="900" y2="140"/>
    <line x1="0" y1="210" x2="900" y2="210"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
  </g>

  <!-- Data flow decoration (left) -->
  <g opacity="0.12">
    <circle cx="80" cy="90" r="24" fill="none" stroke="url(#teal)" stroke-width="1.5"/>
    <circle cx="80" cy="90" r="8" fill="#14b8a6"/>
    <line x1="104" y1="90" x2="160" y2="90" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="80" cy="160" r="24" fill="none" stroke="url(#teal)" stroke-width="1.5"/>
    <circle cx="80" cy="160" r="8" fill="#14b8a6"/>
    <line x1="104" y1="160" x2="160" y2="160" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="80" cy="230" r="24" fill="none" stroke="url(#teal)" stroke-width="1.5"/>
    <circle cx="80" cy="230" r="8" fill="#14b8a6"/>
    <line x1="104" y1="230" x2="160" y2="230" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Data flow decoration (right) -->
  <g opacity="0.12">
    <rect x="760" y="75" width="80" height="30" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="800" y="95" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#3b82f6">RSI 62.4</text>
    <rect x="760" y="120" width="80" height="30" rx="4" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <text x="800" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#22c55e">PE 18.2</text>
    <rect x="760" y="165" width="80" height="30" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="800" y="185" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#f59e0b">SMA 215</text>
    <rect x="760" y="210" width="80" height="30" rx="4" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <text x="800" y="230" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#ef4444">MACD +2.1</text>
  </g>

  <!-- Title -->
  <text x="450" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="url(#blue)" filter="url(#glow)">MCP Market Data</text>
  <text x="450" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#818cf8" letter-spacing="5">ALPHA VANTAGE + YFINANCE</text>

  <!-- Subtitle -->
  <text x="450" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">Real-time stock data as MCP tools for Claude Code and claude.ai</text>

  <!-- Feature pills -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
    <rect x="195" y="185" width="100" height="28" rx="14" fill="#3b82f620" stroke="#3b82f6" stroke-width="1"/>
    <text x="245" y="203" text-anchor="middle" fill="#60a5fa">8 Tools</text>

    <rect x="310" y="185" width="110" height="28" rx="14" fill="#14b8a620" stroke="#14b8a6" stroke-width="1"/>
    <text x="365" y="203" text-anchor="middle" fill="#2dd4bf">Local + Remote</text>

    <rect x="435" y="185" width="120" height="28" rx="14" fill="#f59e0b20" stroke="#f59e0b" stroke-width="1"/>
    <text x="495" y="203" text-anchor="middle" fill="#fbbf24">Rate Limited</text>

    <rect x="570" y="185" width="135" height="28" rx="14" fill="#8b5cf620" stroke="#8b5cf6" stroke-width="1"/>
    <text x="637" y="203" text-anchor="middle" fill="#a78bfa">Railway Deploy</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="235" width="900" height="45" fill="#ffffff04"/>
  <text x="450" y="262" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">claude mcp add market-data -- python server.py</text>
</svg>
